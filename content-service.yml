
server:
  port: 8082

spring:
  application:
    name: content-service

  datasource:
    url: jdbc:postgresql://localhost:5432/smartlearn_content
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

content:
  storage:
    pdf-directory: uploads/pdfs
