
server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/learning_db
    username: postgres
    password: YOUR_ACTUAL_POSTGRES_PASSWORD
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

document:
  service:
    url: http://localhost:8082

ai:
  enabled: false
  api-url:
  api-key:
  model:

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
